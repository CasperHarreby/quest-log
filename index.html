<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casper's Quest Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #14101f;
    --bg-2: #1a1530;
    --panel: #211a37;
    --panel-2: #271f40;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(231,178,76,0.28);
    --gold: #e7b24c;
    --gold-soft: #f6d488;
    --violet: #a594f0;
    --violet-dim: #8b7bd8;
    --emerald: #4fd6a0;
    --text: #ede9f5;
    --muted: #a79fc0;
    --muted-2: #766f92;
    --danger: #e06a6a;
    --ring-track: rgba(255,255,255,0.09);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(139,123,216,0.12), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(231,178,76,0.07), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .brand h1 {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 700;
    font-size: clamp(24px, 4vw, 34px);
    letter-spacing: 0.06em;
    margin: 0;
    color: var(--gold-soft);
    text-shadow: 0 2px 18px rgba(231,178,76,0.18);
  }
  .brand p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13.5px;
  }
  .ghost-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 12px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .ghost-btn:hover { color: var(--text); border-color: var(--line-strong); }

  /* ---------- Character panel ---------- */
  .character {
    display: flex;
    align-items: center;
    gap: 22px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line-strong);
    border-radius: 18px;
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
  }
  .character::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(400px 160px at 12% 0%, rgba(231,178,76,0.10), transparent 70%);
    pointer-events: none;
  }

  .medallion {
    position: relative;
    width: 118px;
    height: 118px;
    flex: 0 0 auto;
  }
  .medallion svg { display: block; transform: rotate(-90deg); }
  .medallion .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }
  .medallion .lvl-num {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 700;
    font-size: 40px;
    line-height: 1;
    color: var(--gold-soft);
  }
  .medallion .lvl-label {
    font-size: 10px;
    letter-spacing: 0.32em;
    color: var(--muted-2);
    text-transform: uppercase;
    margin-top: 3px;
  }
  .medallion.levelup { animation: pop .6s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    35% { transform: scale(1.09); }
    100% { transform: scale(1); }
  }

  .char-info { flex: 1 1 auto; min-width: 0; }
  .rank {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text);
    margin: 0 0 2px;
  }
  .rank .name { color: var(--violet); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0; }
  .xp-line {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    font-size: 12.5px;
    color: var(--muted);
    margin: 10px 0 6px;
  }
  .xp-line b { color: var(--gold-soft); font-weight: 600; }
  .xp-bar {
    height: 10px;
    border-radius: 999px;
    background: var(--ring-track);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .xp-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-soft));
    border-radius: 999px;
    width: 0%;
    transition: width .5s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 0 12px rgba(231,178,76,0.5);
  }
  .chips { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .chip b { color: var(--text); font-weight: 600; }
  .chip .ic { font-size: 14px; }

  /* ---------- Week nav ---------- */
  .weeknav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 26px 0 16px;
  }
  .weeknav .label {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--text);
    min-width: 220px;
    text-align: center;
  }
  .weeknav .label small { display:block; color: var(--muted-2); font-family:'Inter',sans-serif; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; margin-top:2px; }
  .nav-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: border-color .15s, background .15s;
  }
  .nav-btn:hover { border-color: var(--line-strong); background: var(--panel-2); }
  .today-btn {
    background: transparent; border: 1px solid var(--line);
    color: var(--violet); border-radius: 10px; height: 38px; padding: 0 14px;
    font-size: 12.5px; font-family: inherit; cursor: pointer; transition: border-color .15s;
  }
  .today-btn:hover { border-color: var(--violet-dim); }

  /* ---------- Section labels ---------- */
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--violet-dim);
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 12px;
  }
  .eyebrow::after { content:""; flex:1; height:1px; background: var(--line); }

  /* ---------- Weekly panel ---------- */
  .weekly {
    background: linear-gradient(180deg, var(--panel), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 28px;
  }

  /* ---------- Days grid ---------- */
  .days {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(146px, 1fr));
    gap: 12px;
    align-items: start;
  }
  .day {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 12px 14px;
    min-height: 130px;
    display: flex;
    flex-direction: column;
  }
  .day.today {
    border-color: var(--line-strong);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    box-shadow: 0 0 0 1px rgba(231,178,76,0.12), 0 8px 26px rgba(0,0,0,0.35);
  }
  .day-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 10px;
  }
  .day-head .dow {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 13px; letter-spacing: 0.06em; color: var(--text);
  }
  .day.today .day-head .dow { color: var(--gold-soft); }
  .day-head .dom { font-size: 11px; color: var(--muted-2); }
  .today-tag {
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gold); border: 1px solid var(--line-strong);
    border-radius: 6px; padding: 1px 5px;
  }

  /* ---------- Quest rows ---------- */
  .quests { list-style: none; margin: 0 0 8px; padding: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .quest {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 5px 4px; border-radius: 8px;
    transition: background .12s;
  }
  .quest:hover { background: rgba(255,255,255,0.03); }
  .check {
    flex: 0 0 auto; margin-top: 1px;
    width: 18px; height: 18px; border-radius: 6px;
    border: 1.6px solid var(--muted-2); background: transparent;
    cursor: pointer; display: grid; place-items: center;
    transition: border-color .15s, background .15s;
    padding: 0;
  }
  .check:hover { border-color: var(--gold); }
  .check svg { width: 12px; height: 12px; opacity: 0; transform: scale(.5); transition: opacity .15s, transform .15s; }
  .quest.done .check { background: var(--emerald); border-color: var(--emerald); }
  .quest.done .check svg { opacity: 1; transform: scale(1); }
  .q-text {
    flex: 1; font-size: 13px; line-height: 1.4; color: var(--text);
    word-break: break-word; cursor: pointer; padding-top: 1px;
  }
  .quest.done .q-text { color: var(--muted-2); text-decoration: line-through; text-decoration-color: rgba(167,159,192,0.5); }
  .weekly .q-text { font-size: 13.5px; }
  .remove {
    flex: 0 0 auto; background: transparent; border: none; color: var(--muted-2);
    cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 6px;
    opacity: 0; transition: opacity .12s, color .12s;
  }
  .quest:hover .remove, .quest:focus-within .remove { opacity: 1; }
  .remove:hover { color: var(--danger); }

  .overdue-badge {
    flex: 0 0 auto; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--danger); border: 1px solid rgba(224,106,106,0.4);
    border-radius: 6px; padding: 1px 5px; margin-top: 1px;
  }
  .g-badge {
    flex: 0 0 auto; font-size: 9px; font-weight: 700; color: var(--violet);
    border: 1px solid var(--line); border-radius: 5px; width: 15px; height: 15px;
    display: grid; place-items: center; margin-top: 1px;
  }

  .empty { font-size: 12px; color: var(--muted-2); font-style: italic; padding: 4px 4px 8px; }

  /* ---------- Add row ---------- */
  .add-row { display: flex; gap: 6px; margin-top: auto; }
  .weekly .add-row { margin-top: 6px; }
  .add-input {
    flex: 1; min-width: 0;
    background: rgba(0,0,0,0.22);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit; font-size: 12.5px;
    padding: 7px 9px;
    transition: border-color .15s;
  }
  .add-input::placeholder { color: var(--muted-2); }
  .add-input:focus { outline: none; border-color: var(--violet-dim); }
  .add-btn {
    flex: 0 0 auto;
    background: rgba(231,178,76,0.12);
    border: 1px solid var(--line-strong);
    color: var(--gold-soft);
    border-radius: 8px; cursor: pointer;
    font-size: 16px; line-height: 1; width: 32px;
    transition: background .15s;
  }
  .add-btn:hover { background: rgba(231,178,76,0.22); }

  /* ---------- Toast ---------- */
  .toast-wrap {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    z-index: 50; pointer-events: none;
  }
  .toast {
    background: var(--panel-2); border: 1px solid var(--line-strong);
    color: var(--text); border-radius: 11px; padding: 9px 16px;
    font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    animation: rise .3s ease, fade .4s ease 1.4s forwards;
  }
  .toast.levelup {
    background: linear-gradient(90deg, rgba(231,178,76,0.22), rgba(165,148,240,0.18));
    color: var(--gold-soft); font-family: 'Cinzel', serif; letter-spacing: 0.06em;
  }
  .toast .xp { color: var(--gold-soft); font-weight: 600; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fade { to { opacity: 0; transform: translateY(-6px); } }

  :focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 560px) {
    .character { flex-direction: column; text-align: center; align-items: center; }
    .char-info { width: 100%; }
    .chips { justify-content: center; }
    .weeknav .label { min-width: 0; }
  }

  /* ---------- Login screen ---------- */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line-strong);
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .login-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(400px 200px at 50% 0%, rgba(231,178,76,0.08), transparent 70%);
    pointer-events: none;
  }
  .login-card h1 {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.06em;
    margin: 0 0 8px;
    color: var(--gold-soft);
    text-shadow: 0 2px 18px rgba(231,178,76,0.18);
  }
  .login-card p {
    color: var(--muted);
    font-size: 13.5px;
    margin: 0 0 28px;
    line-height: 1.5;
  }
  .login-input {
    width: 100%;
    background: rgba(0,0,0,0.22);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 11px 14px;
    margin-bottom: 12px;
    transition: border-color .15s;
  }
  .login-input::placeholder { color: var(--muted-2); }
  .login-input:focus { outline: none; border-color: var(--violet-dim); }
  .login-btn {
    width: 100%;
    background: rgba(231,178,76,0.14);
    border: 1px solid var(--line-strong);
    color: var(--gold-soft);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 0.06em;
    padding: 12px;
    transition: background .15s;
  }
  .login-btn:hover { background: rgba(231,178,76,0.26); }
  .login-btn:disabled { opacity: 0.5; cursor: default; }
  .login-msg {
    margin-top: 16px;
    font-size: 13px;
    color: var(--emerald);
    min-height: 20px;
    line-height: 1.4;
  }
  .login-msg.err { color: var(--danger); }
</style>
</head>
<body>

<div id="login" style="display:none">
  <div class="login-wrap">
    <div class="login-card">
      <h1>Casper's Quest Log</h1>
      <p>Enter your email to receive a magic sign-in link.</p>
      <input class="login-input" id="login-email" type="email" placeholder="your@email.com" autocomplete="email">
      <button class="login-btn" id="login-btn">Send Magic Link</button>
      <div class="login-msg" id="login-msg"></div>
    </div>
  </div>
</div>

<div class="app" id="app" style="display:none"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
(function () {
  "use strict";

  // ---------- Supabase ----------
  var SUPABASE_URL = 'https://ohetyemqmfwglapbhgzj.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_EA4ylN8icKrqbM9AjuBggQ_8Dy1g6kD';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---------- Google Tasks config ----------
  var GOOGLE_CLIENT_ID = '749692817208-u64k0pl8mqa0av4llh7cjnirnqqs6uo0.apps.googleusercontent.com';
  var GOOGLE_TASKS_SCOPE = 'https://www.googleapis.com/auth/tasks';
  var GOOGLE_LIST_NAMES = { calendar: 'Opgaver (Kalender)', misc: 'To-do (Misc)' };
  var GOOGLE_TASKS_API = 'https://tasks.googleapis.com/tasks/v1';
  var GOOGLE_REDIRECT_URI = 'https://casperharreby.github.io/quest-log/';
  var GOOGLE_AUTH_URL = 'https://accounts.google.com/o/oauth2/v2/auth';

  // ---------- Config ----------
  var STORAGE_KEY = "questlog:v1";
  var DAILY_XP = 10;
  var WEEKLY_XP = 40;
  var DOW = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var RING_R = 52;
  var RING_C = 2 * Math.PI * RING_R;

  // ---------- State ----------
  function freshState(){
    return { character: { totalXp: 0, name: "" }, weeks: {}, completedDates: {},
      google: { calendarListId: null, miscListId: null, lastSyncedAt: null } };
  }
  var state = freshState();
  var viewMonday = mondayOf(new Date());
  var lastFocus = null;
  var prevLevel = 1;
  var currentUser = null;
  var saveTimer = null;

  // ---------- Google Tasks runtime (never persisted) ----------
  var googleAccessToken = null;
  var googleAccessTokenExpiresAt = 0; // epoch ms
  var googleSyncing = false;
  var googleLastError = null;
  var googleSyncStatus = 'disconnected'; // disconnected | idle | syncing | error

  // ---------- Date helpers ----------
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function toKey(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
  function mondayOf(d){
    var day = d.getDay();
    var offset = (day === 0) ? -6 : 1 - day;
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()+offset);
  }
  function dateFromKey(key){
    var parts = key.split("-");
    return new Date(+parts[0], +parts[1]-1, +parts[2]);
  }

  // ---------- Level maths ----------
  function xpForLevel(L){ return 100 * L; }
  function cumToReach(L){ return 100 * (L-1) * L / 2; }
  function levelFromXp(xp){
    var L = 1;
    while (cumToReach(L+1) <= xp) L++;
    return L;
  }
  var RANKS = [
    {min:1,  t:"Novice"},   {min:2,  t:"Apprentice"}, {min:4,  t:"Adept"},
    {min:7,  t:"Journeyman"},{min:11, t:"Expert"},    {min:16, t:"Master"},
    {min:25, t:"Grandmaster"},{min:40, t:"Legend"}
  ];
  function rankFor(L){
    var r = "Novice";
    for (var i=0;i<RANKS.length;i++){ if (L >= RANKS[i].min) r = RANKS[i].t; }
    return r;
  }

  // ---------- Storage ----------
  function save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      if (!currentUser) return;
      sb.from('quest_data').upsert(
        { user_id: currentUser.id, data: state, updated_at: new Date().toISOString() },
        { onConflict: 'user_id' }
      ).then(function(res){
        if (res.error) console.error('Save error:', res.error);
      });
    }, 1200);
  }

  function loadFromRemote(cb){
    sb.from('quest_data')
      .select('data')
      .eq('user_id', currentUser.id)
      .maybeSingle()
      .then(function(res){
        if (res.data && res.data.data){
          try {
            var parsed = res.data.data;
            if (parsed && parsed.character) state = parsed;
            if (!state.completedDates) state.completedDates = {};
            if (!state.weeks) state.weeks = {};
            if (!state.google) state.google = { calendarListId: null, miscListId: null, lastSyncedAt: null };
          } catch(e){}
        }
        cb();
      }).catch(function(){ cb(); });
  }

  // ---------- Auth UI ----------
  function showLogin(){
    document.getElementById('login').style.display = '';
    document.getElementById('app').style.display = 'none';
  }
  function showApp(){
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = '';
  }

  document.getElementById('login-btn').addEventListener('click', function(){
    var email = document.getElementById('login-email').value.trim();
    var msg = document.getElementById('login-msg');
    var btn = document.getElementById('login-btn');
    if (!email){ msg.textContent = 'Please enter your email.'; msg.className = 'login-msg err'; return; }
    btn.disabled = true;
    msg.textContent = 'Sending…'; msg.className = 'login-msg';
    sb.auth.signInWithOtp({
      email: email,
      options: { emailRedirectTo: window.location.origin + window.location.pathname }
    }).then(function(res){
      btn.disabled = false;
      if (res.error){ msg.textContent = res.error.message; msg.className = 'login-msg err'; }
      else { msg.textContent = 'Magic link sent! Check your inbox ✓'; }
    });
  });

  document.getElementById('login-email').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });

  // ---------- Week data access ----------
  function weekKey(){ return toKey(viewMonday); }
  function weekBucket(mondayKey){
    if (!state.weeks[mondayKey]) state.weeks[mondayKey] = { weekly: [], days: {} };
    if (!state.weeks[mondayKey].days) state.weeks[mondayKey].days = {};
    return state.weeks[mondayKey];
  }
  function currentWeek(){ return weekBucket(weekKey()); }
  function dayBucket(dateKey){
    var w = weekBucket(toKey(mondayOf(dateFromKey(dateKey))));
    if (!w.days[dateKey]) w.days[dateKey] = [];
    return w.days[dateKey];
  }
  function dayList(dateKey){ return dayBucket(dateKey); }
  function uid(){
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : "q" + Date.now() + Math.random().toString(36).slice(2,7);
  }

  // ---------- Mutations ----------
  function addWeekly(text){
    text = (text||"").trim(); if (!text) return;
    var q = { id: uid(), text: text, done: false };
    currentWeek().weekly.push(q);
    lastFocus = { kind:"weekly" };
    commit();
    pushGoogleCreateWeekly(q);
  }
  function addDaily(dateKey, text){
    text = (text||"").trim(); if (!text) return;
    var q = { id: uid(), text: text, done: false };
    dayList(dateKey).push(q);
    lastFocus = { kind:"daily", date: dateKey };
    commit();
    pushGoogleCreateDaily(q, dateKey);
  }
  function removeWeekly(id){
    var w = currentWeek();
    var q = find(w.weekly, id);
    if (q && q.done) state.character.totalXp = Math.max(0, state.character.totalXp - WEEKLY_XP);
    w.weekly = w.weekly.filter(function(x){ return x.id !== id; });
    commit();
    if (q) pushGoogleDelete(q);
  }
  function removeDaily(dateKey, id){
    var arr = dayList(dateKey);
    var q = find(arr, id);
    if (q && q.done) state.character.totalXp = Math.max(0, state.character.totalXp - DAILY_XP);
    currentWeek().days[dateKey] = arr.filter(function(x){ return x.id !== id; });
    refreshDateBucket(dateKey);
    commit();
    if (q) pushGoogleDelete(q);
  }
  function toggleWeeklyQuest(q, silent){
    q.done = !q.done;
    state.character.totalXp += q.done ? WEEKLY_XP : -WEEKLY_XP;
    if (state.character.totalXp < 0) state.character.totalXp = 0;
    if (q.done && !silent) flashXp(WEEKLY_XP);
  }
  function toggleWeekly(id){
    var q = find(currentWeek().weekly, id); if (!q) return;
    toggleWeeklyQuest(q);
    commit();
    pushGoogleCompletion(q);
  }
  function toggleDailyQuest(q, dateKey, silent){
    q.done = !q.done;
    state.character.totalXp += q.done ? DAILY_XP : -DAILY_XP;
    if (state.character.totalXp < 0) state.character.totalXp = 0;
    if (q.done && !silent) flashXp(DAILY_XP);
    refreshDateBucket(dateKey);
  }
  function toggleDaily(dateKey, id){
    var q = find(dayList(dateKey), id); if (!q) return;
    toggleDailyQuest(q, dateKey);
    commit();
    pushGoogleCompletion(q);
  }
  function find(arr, id){ for (var i=0;i<arr.length;i++) if (arr[i].id===id) return arr[i]; return null; }

  function refreshDateBucket(dateKey){
    var w = weekBucket(toKey(mondayOf(dateFromKey(dateKey))));
    var arr = w.days[dateKey] || [];
    var any = arr.some(function(q){ return q.done; });
    if (any) state.completedDates[dateKey] = true;
    else delete state.completedDates[dateKey];
  }

  function resetAll(){
    if (!confirm("Reset all progress? This clears your level, XP, and every quest. This cannot be undone.")) return;
    state = freshState();
    viewMonday = mondayOf(new Date());
    prevLevel = 1;
    commit();
  }

  function signOut(){
    sb.auth.signOut().then(function(){
      currentUser = null;
      state = freshState();
      viewMonday = mondayOf(new Date());
      prevLevel = 1;
      googleAccessToken = null;
      googleSyncStatus = 'disconnected';
      googleLastError = null;
    });
  }

  // ---------- Streak ----------
  function computeStreak(){
    var set = state.completedDates || {};
    var cursor = new Date();
    cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
    if (!set[toKey(cursor)]) cursor = addDays(cursor, -1);
    var count = 0;
    while (set[toKey(cursor)]) { count++; cursor = addDays(cursor, -1); }
    return count;
  }
  function totalCompleted(){
    var n = 0;
    for (var wk in state.weeks){
      var w = state.weeks[wk];
      (w.weekly||[]).forEach(function(q){ if(q.done) n++; });
      var days = w.days||{};
      for (var d in days) days[d].forEach(function(q){ if(q.done) n++; });
    }
    return n;
  }

  // ---------- Commit ----------
  function commit(){
    save();
    render();
    var lvl = levelFromXp(state.character.totalXp);
    if (lvl > prevLevel){
      toast("LEVEL " + lvl + "  —  " + rankFor(lvl), "levelup");
      var med = document.querySelector(".medallion");
      if (med){ med.classList.remove("levelup"); void med.offsetWidth; med.classList.add("levelup"); }
    }
    prevLevel = lvl;
  }
  var pendingXp = 0;
  function flashXp(amt){ pendingXp = amt; }

  // ---------- Toasts ----------
  function toast(msg, cls){
    var wrap = document.getElementById("toasts");
    var el = document.createElement("div");
    el.className = "toast" + (cls ? " " + cls : "");
    el.innerHTML = msg;
    wrap.appendChild(el);
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 1900);
  }

  // ---------- Google Tasks: auth ----------
  // Ongoing token refresh goes through the google-token Edge Function (a
  // plain HTTPS call — never blocked by the browser's popup-gesture rule).
  // Only the very first-ever authorization per Google account needs a
  // full-page redirect to Google's consent screen, since that's the only
  // way to obtain a refresh token (GIS's JS popup helpers don't support
  // requesting offline access).
  function buildGoogleAuthUrl(){
    var oauthState = uid();
    try { sessionStorage.setItem('googleOAuthState', oauthState); } catch(e){}
    var params = new URLSearchParams({
      client_id: GOOGLE_CLIENT_ID,
      redirect_uri: GOOGLE_REDIRECT_URI,
      response_type: 'code',
      scope: GOOGLE_TASKS_SCOPE,
      access_type: 'offline',
      prompt: 'consent',
      include_granted_scopes: 'true',
      state: oauthState
    });
    return GOOGLE_AUTH_URL + '?' + params.toString();
  }
  function fetchGoogleTokenFromBackend(payload){
    return sb.functions.invoke('google-token', { body: payload || {} }).then(function(res){
      if (res.error) throw new Error(res.error.message || 'Google token request failed');
      return res.data;
    });
  }
  function ensureGoogleToken(){
    if (googleAccessToken && Date.now() < googleAccessTokenExpiresAt){
      return Promise.resolve();
    }
    return fetchGoogleTokenFromBackend({}).then(function(data){
      if (data && data.access_token){
        googleAccessToken = data.access_token;
        googleAccessTokenExpiresAt = Date.now() + (data.expires_in - 60) * 1000;
        return;
      }
      window.location.href = buildGoogleAuthUrl();
      return new Promise(function(){}); // navigating away — never resolves
    });
  }
  function handleGoogleAuthRedirect(){
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    if (!code) return false;
    var returnedState = params.get('state');
    var expectedState = null;
    try { expectedState = sessionStorage.getItem('googleOAuthState'); } catch(e){}
    history.replaceState(null, '', window.location.pathname);
    if (!returnedState || returnedState !== expectedState){
      googleLastError = 'Google sign-in state mismatch — please try connecting again.';
      return true;
    }
    fetchGoogleTokenFromBackend({ code: code, redirectUri: GOOGLE_REDIRECT_URI }).then(function(data){
      if (data && data.access_token){
        googleAccessToken = data.access_token;
        googleAccessTokenExpiresAt = Date.now() + (data.expires_in - 60) * 1000;
        syncGoogleTasks();
      } else {
        googleLastError = (data && data.error) || 'Google connection failed.';
        googleSyncStatus = 'error';
        render();
      }
    }).catch(function(e){
      googleLastError = e.message;
      googleSyncStatus = 'error';
      render();
    });
    return true;
  }
  function googleApiFetch(url, options, retried){
    options = options || {};
    options.headers = Object.assign({}, options.headers, { Authorization: "Bearer " + googleAccessToken });
    return fetch(url, options).then(function(res){
      if (res.status === 401 && !retried){
        googleAccessToken = null;
        return ensureGoogleToken().then(function(){
          return googleApiFetch(url, options, true);
        });
      }
      if (!res.ok) return res.text().then(function(t){ throw new Error("Google API error " + res.status + ": " + t); });
      if (res.status === 204) return null;
      return res.json();
    });
  }

  // ---------- Google Tasks: list resolution ----------
  function resolveGoogleLists(force){
    if (!force && state.google.calendarListId && state.google.miscListId){
      return Promise.resolve();
    }
    return googleApiFetch(GOOGLE_TASKS_API + "/users/@me/lists").then(function(res){
      var items = (res && res.items) || [];
      var byTitle = {};
      items.forEach(function(l){ byTitle[l.title] = l.id; });
      var calId = byTitle[GOOGLE_LIST_NAMES.calendar];
      var miscId = byTitle[GOOGLE_LIST_NAMES.misc];
      if (!calId) throw new Error('Google Tasks list "' + GOOGLE_LIST_NAMES.calendar + '" not found.');
      if (!miscId) throw new Error('Google Tasks list "' + GOOGLE_LIST_NAMES.misc + '" not found.');
      state.google.calendarListId = calId;
      state.google.miscListId = miscId;
    });
  }

  // ---------- Google Tasks: fetch ----------
  function fetchAllGoogleTasks(listId, pageToken, acc){
    acc = acc || [];
    var url = GOOGLE_TASKS_API + "/lists/" + encodeURIComponent(listId) + "/tasks?showCompleted=false&maxResults=100";
    if (pageToken) url += "&pageToken=" + encodeURIComponent(pageToken);
    return googleApiFetch(url).then(function(res){
      var items = (res && res.items) || [];
      acc = acc.concat(items);
      if (res && res.nextPageToken) return fetchAllGoogleTasks(listId, res.nextPageToken, acc);
      return acc;
    });
  }

  // ---------- Google Tasks: push (called only from user-triggered mutations) ----------
  function pushGoogleCompletion(q){
    if (!q || !q.gtId || !q.gtListId || !googleAccessToken) return;
    googleApiFetch(GOOGLE_TASKS_API + "/lists/" + encodeURIComponent(q.gtListId) + "/tasks/" + encodeURIComponent(q.gtId), {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: q.done ? "completed" : "needsAction" })
    }).catch(function(e){ googleLastError = e.message; });
  }
  function pushGoogleDelete(q){
    if (!q || !q.gtId || !q.gtListId || !googleAccessToken) return;
    googleApiFetch(GOOGLE_TASKS_API + "/lists/" + encodeURIComponent(q.gtListId) + "/tasks/" + encodeURIComponent(q.gtId), {
      method: "DELETE"
    }).catch(function(e){ googleLastError = e.message; });
  }
  function pushGoogleCreateDaily(q, dateKey){
    if (!q || !googleAccessToken || !state.google.calendarListId) return Promise.resolve();
    var listId = state.google.calendarListId;
    return googleApiFetch(GOOGLE_TASKS_API + "/lists/" + encodeURIComponent(listId) + "/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: q.text, due: dateKey + "T00:00:00.000Z", status: q.done ? "completed" : "needsAction" })
    }).then(function(task){
      q.gtId = task.id;
      q.gtListId = listId;
      q.gtDueKey = dateKey;
      commit();
    }).catch(function(e){ googleLastError = e.message; });
  }
  function pushGoogleCreateWeekly(q){
    if (!q || !googleAccessToken || !state.google.miscListId) return Promise.resolve();
    var listId = state.google.miscListId;
    return googleApiFetch(GOOGLE_TASKS_API + "/lists/" + encodeURIComponent(listId) + "/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: q.text, status: q.done ? "completed" : "needsAction" })
    }).then(function(task){
      q.gtId = task.id;
      q.gtListId = listId;
      commit();
    }).catch(function(e){ googleLastError = e.message; });
  }

  // ---------- Google Tasks: backfill quests created while disconnected ----------
  function backfillUnlinkedQuests(){
    var promises = [];
    for (var wk in state.weeks){
      var week = state.weeks[wk];
      (week.weekly || []).forEach(function(q){
        if (!q.gtId) promises.push(pushGoogleCreateWeekly(q));
      });
      var days = week.days || {};
      for (var dk in days){
        days[dk].forEach(function(q){
          if (!q.gtId) promises.push(pushGoogleCreateDaily(q, dk));
        });
      }
    }
    return Promise.all(promises);
  }

  // ---------- Google Tasks: index of already-linked quests ----------
  function indexLinkedQuests(listId){
    var byId = {};
    for (var wk in state.weeks){
      var days = state.weeks[wk].days || {};
      for (var dk in days){
        days[dk].forEach(function(q){
          if (q.gtListId === listId) byId[q.gtId] = { q: q, dateKey: dk };
        });
      }
    }
    return byId;
  }
  function indexLinkedWeeklyQuests(listId){
    var byId = {};
    for (var wk in state.weeks){
      (state.weeks[wk].weekly || []).forEach(function(q){
        if (q.gtListId === listId) byId[q.gtId] = { q: q, weekKey: wk };
      });
    }
    return byId;
  }

  // ---------- Google Tasks: sync passes ----------
  var googleXpGained = 0;
  function syncCalendarList(){
    var listId = state.google.calendarListId;
    return fetchAllGoogleTasks(listId).then(function(items){
      var todayKey = toKey(new Date());
      var existing = indexLinkedQuests(listId);
      var seen = {};
      items.forEach(function(task){
        seen[task.id] = true;
        if (existing[task.id]) return; // already linked locally
        if (!task.due) return; // calendar list is due-date-driven only
        var d = new Date(task.due); // Google due is midnight UTC
        var dueKey = d.getUTCFullYear() + "-" + pad(d.getUTCMonth()+1) + "-" + pad(d.getUTCDate());
        var targetKey = dueKey >= todayKey ? dueKey : todayKey;
        dayBucket(targetKey).push({ id: uid(), text: task.title || "(untitled)", done: false,
          gtId: task.id, gtListId: listId, gtDueKey: dueKey });
      });
      for (var gtId in existing){
        if (seen[gtId]) continue;
        var entry = existing[gtId];
        if (!entry.q.done){
          toggleDailyQuest(entry.q, entry.dateKey, true);
          googleXpGained += DAILY_XP;
        }
      }
    });
  }
  function syncMiscList(){
    var listId = state.google.miscListId;
    return fetchAllGoogleTasks(listId).then(function(items){
      var existing = indexLinkedWeeklyQuests(listId);
      var seen = {};
      var thisWeekKey = toKey(mondayOf(new Date()));
      items.forEach(function(task){
        seen[task.id] = true;
        if (existing[task.id]) return;
        weekBucket(thisWeekKey).weekly.push({ id: uid(), text: task.title || "(untitled)", done: false,
          gtId: task.id, gtListId: listId });
      });
      for (var gtId in existing){
        if (seen[gtId]) continue;
        var entry = existing[gtId];
        if (!entry.q.done){
          toggleWeeklyQuest(entry.q, true);
          googleXpGained += WEEKLY_XP;
        }
      }
    });
  }

  // ---------- Google Tasks: overdue rollover (local only, no network) ----------
  function runOverdueRollover(){
    var listId = state.google.calendarListId;
    if (!listId) return;
    var todayKey = toKey(new Date());
    var moves = [];
    for (var wk in state.weeks){
      var days = state.weeks[wk].days || {};
      for (var dk in days){
        if (dk >= todayKey) continue;
        days[dk].forEach(function(q){
          if (q.gtListId === listId && !q.done) moves.push({ q: q, fromKey: dk });
        });
      }
    }
    if (!moves.length) return;
    moves.forEach(function(m){
      var fromArr = state.weeks[toKey(mondayOf(dateFromKey(m.fromKey)))].days[m.fromKey];
      var idx = fromArr.indexOf(m.q);
      if (idx !== -1) fromArr.splice(idx, 1);
      dayBucket(todayKey).push(m.q);
      refreshDateBucket(m.fromKey);
    });
    refreshDateBucket(todayKey);
  }

  // ---------- Google Tasks: sync orchestration ----------
  function syncGoogleTasks(){
    if (googleSyncing) return;
    googleSyncing = true;
    googleSyncStatus = 'syncing';
    googleLastError = null;
    googleXpGained = 0;
    render();

    function finish(){
      googleSyncing = false;
      googleSyncStatus = 'idle';
      if (googleXpGained > 0) flashXp(googleXpGained);
      state.google.lastSyncedAt = new Date().toISOString();
      commit();
    }
    function fail(err){
      googleSyncing = false;
      googleSyncStatus = 'error';
      googleLastError = err.message || String(err);
      toast('Google sync failed: ' + esc(googleLastError));
      render();
    }

    ensureGoogleToken()
      .then(function(){ return resolveGoogleLists(); })
      .catch(function(err){
        // stale cached list id (e.g. 404) — re-resolve once and retry
        if (/404/.test(err.message)){
          return resolveGoogleLists(true);
        }
        throw err;
      })
      .then(function(){ return syncCalendarList(); })
      .then(function(){ return syncMiscList(); })
      .then(function(){ return backfillUnlinkedQuests(); })
      .then(function(){ runOverdueRollover(); finish(); })
      .catch(fail);
  }

  // ---------- Rendering ----------
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#14101f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';

  function weekLabel(){
    var end = addDays(viewMonday, 6);
    var a = MON[viewMonday.getMonth()] + " " + viewMonday.getDate();
    var b = MON[end.getMonth()] + " " + end.getDate();
    return a + " – " + b + ", " + end.getFullYear();
  }
  function weekRelative(){
    var thisMon = mondayOf(new Date());
    var diff = Math.round((viewMonday - thisMon) / (7*864e5));
    if (diff === 0) return "This week";
    if (diff === -1) return "Last week";
    if (diff === 1) return "Next week";
    if (diff < 0) return Math.abs(diff) + " weeks ago";
    return "In " + diff + " weeks";
  }

  function questRow(q, scopeAttr, todayKey){
    var overdue = todayKey && q.gtDueKey && q.gtDueKey < todayKey && !q.done;
    var badges =
      (overdue ? '<span class="overdue-badge" title="Originally due ' + q.gtDueKey + '">Overdue</span>' : '') +
      (q.gtId ? '<span class="g-badge" title="Synced from Google Tasks">G</span>' : '');
    return '<li class="quest' + (q.done ? ' done' : '') + '">' +
      '<button class="check" data-act="toggle" ' + scopeAttr + ' data-id="' + q.id + '" ' +
        'aria-pressed="' + q.done + '" aria-label="Toggle quest">' + CHECK_SVG + '</button>' +
      '<span class="q-text" data-act="toggle" ' + scopeAttr + ' data-id="' + q.id + '" role="button" tabindex="0">' + esc(q.text) + '</span>' +
      badges +
      '<button class="remove" data-act="remove" ' + scopeAttr + ' data-id="' + q.id + '" aria-label="Remove quest">×</button>' +
    '</li>';
  }

  function render(){
    var xp = state.character.totalXp;
    var level = levelFromXp(xp);
    var into = xp - cumToReach(level);
    var need = xpForLevel(level);
    var pct = Math.max(0, Math.min(1, into / need));
    var offset = RING_C * (1 - pct);
    var streak = computeStreak();
    var done = totalCompleted();

    var week = currentWeek();
    var todayKey = toKey(new Date());

    var weeklyHtml = week.weekly.length
      ? week.weekly.map(function(q){ return questRow(q, 'data-scope="weekly"'); }).join("")
      : '<div class="empty">No weekly quests yet. Add a goal for the whole week.</div>';

    var daysHtml = "";
    for (var i=0;i<7;i++){
      var d = addDays(viewMonday, i);
      var dk = toKey(d);
      var isToday = dk === todayKey;
      var list = (week.days[dk] || []);
      var rows = list.length
        ? '<ul class="quests">' + list.map(function(q){ return questRow(q, 'data-scope="daily" data-date="'+dk+'"', todayKey); }).join("") + '</ul>'
        : '<div class="empty">No quests</div>';
      daysHtml +=
        '<div class="day' + (isToday ? ' today' : '') + '">' +
          '<div class="day-head">' +
            '<span class="dow">' + DOW[i] + '</span>' +
            (isToday ? '<span class="today-tag">Today</span>' : '<span class="dom">' + MON[d.getMonth()] + ' ' + d.getDate() + '</span>') +
          '</div>' +
          rows +
          '<div class="add-row">' +
            '<input class="add-input" data-add="daily" data-date="' + dk + '" placeholder="Add quest…" maxlength="120" aria-label="Add quest for ' + DOW[i] + '">' +
            '<button class="add-btn" data-act="add" data-add="daily" data-date="' + dk + '" aria-label="Add">+</button>' +
          '</div>' +
        '</div>';
    }

    var nameLabel = state.character.name ? '<span class="name">&nbsp;&middot; ' + esc(state.character.name) + '</span>' : '';

    var syncLabel = { disconnected: "Connect Google Tasks", idle: "Sync now", syncing: "Syncing…", error: "Sync failed — retry" }[googleSyncStatus];
    var syncTitle = googleSyncStatus === 'error' ? esc(googleLastError || '')
      : (googleSyncStatus === 'idle' && state.google.lastSyncedAt) ? 'Last synced ' + new Date(state.google.lastSyncedAt).toLocaleTimeString()
      : '';

    document.getElementById("app").innerHTML =
      '<div class="topbar">' +
        '<div class="brand"><h1>Casper\'s Quest Log</h1><p>Level up your week, one quest at a time.</p></div>' +
        '<div style="display:flex;gap:8px;align-items:center">' +
          '<button class="ghost-btn" data-act="sync-google" title="' + syncTitle + '"' + (googleSyncStatus === 'syncing' ? ' disabled' : '') + '>' + syncLabel + '</button>' +
          '<button class="ghost-btn" data-act="reset">Reset progress</button>' +
          '<button class="ghost-btn" data-act="signout">Sign out</button>' +
        '</div>' +
      '</div>' +

      '<section class="character">' +
        '<div class="medallion">' +
          '<svg width="118" height="118" viewBox="0 0 118 118">' +
            '<circle cx="59" cy="59" r="' + RING_R + '" fill="none" stroke="var(--ring-track)" stroke-width="8"/>' +
            '<circle cx="59" cy="59" r="' + RING_R + '" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" ' +
              'stroke-dasharray="' + RING_C.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '"/>' +
            '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
              '<stop offset="0" stop-color="#e7b24c"/><stop offset="1" stop-color="#f6d488"/>' +
            '</linearGradient></defs>' +
          '</svg>' +
          '<div class="center"><span class="lvl-num">' + level + '</span><span class="lvl-label">Level</span></div>' +
        '</div>' +
        '<div class="char-info">' +
          '<p class="rank">' + rankFor(level) + nameLabel + '</p>' +
          '<div class="xp-line"><span>Progress</span><span><b>' + into + '</b> / ' + need + ' XP</span></div>' +
          '<div class="xp-bar"><div class="xp-fill" id="xpfill"></div></div>' +
          '<div class="chips">' +
            '<span class="chip"><span class="ic">⚔️</span><b>' + done + '</b>&nbsp;quests done</span>' +
            '<span class="chip"><span class="ic">🔥</span><b>' + streak + '</b>&nbsp;day streak</span>' +
            '<span class="chip"><span class="ic">✨</span><b>' + xp + '</b>&nbsp;total XP</span>' +
          '</div>' +
        '</div>' +
      '</section>' +

      '<div class="weeknav">' +
        '<button class="nav-btn" data-act="prev" aria-label="Previous week">‹</button>' +
        '<div class="label">' + weekLabel() + '<small>' + weekRelative() + '</small></div>' +
        '<button class="nav-btn" data-act="next" aria-label="Next week">›</button>' +
        '<button class="today-btn" data-act="today">Today</button>' +
      '</div>' +

      '<section class="weekly">' +
        '<p class="eyebrow">Weekly Quests</p>' +
        '<ul class="quests">' + weeklyHtml + '</ul>' +
        '<div class="add-row">' +
          '<input class="add-input" data-add="weekly" placeholder="Add a weekly quest…" maxlength="120" aria-label="Add a weekly quest">' +
          '<button class="add-btn" data-act="add" data-add="weekly" aria-label="Add">+</button>' +
        '</div>' +
      '</section>' +

      '<p class="eyebrow">The Week</p>' +
      '<div class="days">' + daysHtml + '</div>';

    requestAnimationFrame(function(){
      var f = document.getElementById("xpfill");
      if (f) f.style.width = (pct * 100) + "%";
    });

    if (pendingXp){
      toast('<span class="xp">+' + pendingXp + ' XP</span>');
      pendingXp = 0;
    }

    restoreFocus();
  }

  function restoreFocus(){
    if (!lastFocus) return;
    var sel = lastFocus.kind === "weekly"
      ? 'input[data-add="weekly"]'
      : 'input[data-add="daily"][data-date="' + lastFocus.date + '"]';
    var el = document.querySelector(sel);
    if (el) el.focus();
    lastFocus = null;
  }

  // ---------- Events ----------
  function addFromInput(input){
    if (!input) return;
    var val = input.value;
    if (input.getAttribute("data-add") === "weekly") addWeekly(val);
    else addDaily(input.getAttribute("data-date"), val);
  }

  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "add"){
      var row = t.closest(".add-row");
      addFromInput(row ? row.querySelector(".add-input") : null);
    } else if (act === "toggle"){
      var scope = t.getAttribute("data-scope");
      if (scope === "weekly") toggleWeekly(t.getAttribute("data-id"));
      else toggleDaily(t.getAttribute("data-date"), t.getAttribute("data-id"));
    } else if (act === "remove"){
      var s = t.getAttribute("data-scope");
      if (s === "weekly") removeWeekly(t.getAttribute("data-id"));
      else removeDaily(t.getAttribute("data-date"), t.getAttribute("data-id"));
    } else if (act === "prev"){ viewMonday = addDays(viewMonday, -7); render(); }
    else if (act === "next"){ viewMonday = addDays(viewMonday, 7); render(); }
    else if (act === "today"){ viewMonday = mondayOf(new Date()); render(); }
    else if (act === "reset"){ resetAll(); }
    else if (act === "signout"){ signOut(); }
    else if (act === "sync-google"){ syncGoogleTasks(); }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Enter" && e.target.classList && e.target.classList.contains("add-input")){
      e.preventDefault();
      addFromInput(e.target);
    }
    if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("q-text")){
      e.preventDefault();
      var scope = e.target.getAttribute("data-scope");
      if (scope === "weekly") toggleWeekly(e.target.getAttribute("data-id"));
      else toggleDaily(e.target.getAttribute("data-date"), e.target.getAttribute("data-id"));
    }
  });

  // ---------- Boot ----------
  sb.auth.onAuthStateChange(function(event, session){
    if (session && !currentUser){
      currentUser = session.user;
      loadFromRemote(function(){
        prevLevel = levelFromXp(state.character.totalXp);
        runOverdueRollover();
        showApp();
        render();
        if (!handleGoogleAuthRedirect() && state.google.calendarListId){
          syncGoogleTasks();
        }
      });
    } else if (!session){
      currentUser = null;
      state = freshState();
      viewMonday = mondayOf(new Date());
      prevLevel = 1;
      googleAccessToken = null;
      googleSyncStatus = 'disconnected';
      showLogin();
    }
  });

})();
</script>
</body>
</html>
